name: Deploy preview to GitHub Pages

# Builds the homepage and publishes the self-contained preview file as a
# permanent GitHub Pages site (a stable link that works in any browser).
# Deploys via the Pages artifact API — no extra branch is created.

on:
  push:
    branches: [arena/4fce0f93-smartbryte]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Generate self-contained preview
        run: npm run preview:file

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp SmartBryte-Homepage-Preview.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
